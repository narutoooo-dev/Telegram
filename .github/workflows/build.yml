name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install required NDK
      run: |
        echo "y" | sdkmanager "ndk;27.2.12479018"
        echo "y" | sdkmanager "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy keystore
      run: |
        mkdir -p TMessagesProj/config
        rm -f TMessagesProj/config/release.keystore
        keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Telegram Android, OU=Development, O=Telegram, L=San Francisco, ST=CA, C=US" \
          -noprompt

    - name: Update gradle.properties
      run: |
        sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=androidkey/' gradle.properties

    - name: Update BuildVars with your API credentials
      run: |
        sed -i 's/public static int APP_ID = .*/public static int APP_ID = 26333172;/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "2a031a551da8ca175b0225eac8a2a131";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        
        # طباعة محتوى BuildVars.java للتأكد من التعديل
        echo "=== BuildVars.java after update ==="
        cat TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java | grep -E "APP_ID|APP_HASH"

    - name: Check google-services.json
      run: |
        if [ -f "TMessagesProj/google-services.json" ]; then
          echo "✅ google-services.json found"
          cat TMessagesProj/google-services.json | head -20
        else
          echo "❌ google-services.json NOT found!"
          exit 1
        fi

    - name: Check available Gradle tasks
      run: |
        ./gradlew tasks --no-daemon

    - name: Build with Gradle (full debug)
      env:
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
      run: |
        # تشغيل البناء مع خيارات تصحيح شاملة
        ./gradlew assembleStandaloneRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
        # البحث عن أي رسائل خطأ في السجل
        echo "=== Searching for errors ==="
        grep -i "error\|fail\|exception" build.log | head -50

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: telegram-apk
        path: TMessagesProj/build/outputs/apk/standaloneRelease/*.apk

    - name: Upload build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
