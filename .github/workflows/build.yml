name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # يسمح بتشغيل manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # هذا يضمن تحميل submodules

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install required NDK version
      run: |
        echo "y" | sdkmanager "ndk;27.2.12479018"
        echo "y" | sdkmanager "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # هذه الخطوة ضرورية لتعويض ملفات التوقيع المفقودة (keystore)
    - name: Create dummy keystore and config files
      run: |
        mkdir -p TMessagesProj/config
        # إنشاء keystore وهمي (استخدم كلمة مرور مؤقتة)
        keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
          -alias telegram -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"

    - name: Create Firebase config (dummy)
      run: |
        echo '{}' > TMessagesProj/google-services.json

    - name: Build with Gradle
      env:
        # استخدم المتغيرات التي عرفتها في الخطوة السابقة
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: telegram
      run: ./gradlew assembleStandaloneRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: telegram-apk
        path: TMessagesProj/build/outputs/apk/standaloneRelease/*.apk
