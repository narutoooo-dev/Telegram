name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install required NDK
      run: |
        echo "y" | sdkmanager "ndk;27.2.12479018"
        echo "y" | sdkmanager "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy keystore
      run: |
        mkdir -p TMessagesProj/config
        rm -f TMessagesProj/config/release.keystore
        keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
          -alias androidkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Telegram Android, OU=Development, O=Telegram, L=San Francisco, ST=CA, C=US" \
          -noprompt

    - name: Update gradle.properties
      run: |
        sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=androidkey/' gradle.properties

    - name: Update BuildVars with your API credentials
      run: |
        sed -i 's/public static int APP_ID = .*/public static int APP_ID = 26333172;/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "2a031a551da8ca175b0225eac8a2a131";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

    - name: Fix application name and icon
      run: |
        # 1. تعديل اسم التطبيق في BuildVars.java
        sed -i 's/public static String APPLICATION_NAME = .*/public static String APPLICATION_NAME = "Telegram";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        
        # 2. تعديل ApplicationLoader.java (المصدر الرئيسي للاسم)
        sed -i 's/return "ApplicationLoaderImpl"/return "Telegram"/g' TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
        sed -i 's/return "ApiplicationLoaderImpl"/return "Telegram"/g' TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
        
        # 3. تعديل جميع ملفات strings.xml
        find TMessagesProj/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Telegram<\/string>/g' {} \;
        
        # 4. تعديل AndroidManifest.xml
        sed -i 's/android:label=".*"/android:label="@string\/app_name"/' TMessagesProj/src/main/AndroidManifest.xml
        
        # 5. التأكد من الأيقونات
        echo "✅ All fixes applied"

    - name: Build with Gradle
      env:
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
      run: ./gradlew :TMessagesProj_AppStandalone:assembleRelease --stacktrace

    - name: Find APK files
      run: |
        echo "Searching for APK files..."
        find . -name "*.apk" -type f
        echo "=== APK locations with size ==="
        find . -name "*.apk" -type f -exec ls -lh {} \;

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: telegram-apk
        path: |
          TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          TMessagesProj/build/outputs/apk/**/*.apk
          **/build/outputs/apk/**/*.apk
